<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Online Markdown Editor | Private, Local-First Writing</title>
    <meta name="description" content="A private online Markdown editor and lightweight online code editor that runs in your browser. No account, tracking, ads, or data collection." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://editor.arverma.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://editor.arverma.dev/" />
    <meta property="og:title" content="ConText Editor: Private Online Markdown Editor" />
    <meta property="og:description" content="Write Markdown and code in your browser with local-first storage. No account, tracking, ads, or data collection." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ConText Editor: Private Online Markdown Editor" />
    <meta name="twitter:description" content="Write Markdown and code in your browser with local-first storage. No account, tracking, ads, or data collection." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ConText Editor",
        "url": "https://editor.arverma.dev/",
        "description": "A private online Markdown editor and lightweight online code editor that runs in your browser with local-first storage.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern web browser",
        "isAccessibleForFree": true,
        "featureList": [
          "Online Markdown editor",
          "Browser-based code editing",
          "Local-first note storage",
          "Markdown preview and export"
        ],
        "privacyPolicy": "https://editor.arverma.dev/privacy.html"
      }
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNycgZmlsbD0nIzdjNmNmMCcvPjxwYXRoIGQ9J00xMyA5bC01IDcgNSA3JyBmaWxsPSdub25lJyBzdHJva2U9JyNmZmZmZmYnIHN0cm9rZS13aWR0aD0nMi42JyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnLz48cGF0aCBkPSdNMTkgOWw1IDctNSA3JyBmaWxsPSdub25lJyBzdHJva2U9JyNmZmZmZmYnIHN0cm9rZS13aWR0aD0nMi42JyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnIG9wYWNpdHk9JzAuNTUnLz48L3N2Zz4="
    />
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="ownership.css" />
    <link rel="stylesheet" href="mobile.css" />
    <script>
      // Apply the saved theme synchronously before first paint (no flash of the
      // wrong theme). "system" leaves data-theme unset so the CSS media query governs.
      (function () {
        try {
          var mode = localStorage.getItem("context-editor.theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.dataset.theme = mode;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <main>
        <h1>Private Online Markdown Editor</h1>
        <p>ConText Editor is a Markdown editor and lightweight online code editor that runs in your browser.</p>
        <p>Your notes stay on your device. There is no account, tracking, advertising, or data collection.</p>
        <p>JavaScript is required to use the editor. <a href="privacy.html">Read the privacy policy</a>.</p>
      </main>
    </noscript>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 6l-4 6 4 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 6l4 6-4 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
            </svg>
          </span>
          <span class="brand-name">ConText Editor</span>
        </div>

        <div class="topbar-right">
          <button id="shortcuts-btn" class="sidebar-toggle" type="button" aria-label="Commands and keyboard shortcuts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <span id="note-counts" class="note-counts" aria-live="polite">0 words · 0 chars</span>
          <div id="save-status" role="status" class="save-status" data-state="saved">Saved</div>
          <button id="mobile-actions-toggle" class="sidebar-toggle" type="button" aria-label="More note actions" aria-controls="mobile-actions-dialog" aria-expanded="false" title="More note actions">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
          <div id="theme-toggle" class="theme-toggle" role="group" aria-label="Theme">
            <button type="button" class="theme-opt" data-theme-value="system" title="Follow system theme" aria-label="System theme">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="button" class="theme-opt" data-theme-value="light" title="Light theme" aria-label="Light theme">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="button" class="theme-opt" data-theme-value="dark" title="Dark theme" aria-label="Dark theme">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="body">
        <aside id="sidebar" aria-label="Note history">
          <div class="sidebar-heading"><h2>Notes</h2></div>
          <button id="new-snippet-btn" class="btn-new" type="button" aria-label="New note">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>New note</span>
          </button>
          <div class="note-search-row">
            <input id="note-search" type="search" aria-label="Search notes" placeholder="Search notes…" />
            <button id="clear-search" type="button" aria-label="Clear note search" hidden>×</button>
          </div>
          <span id="search-status" class="visually-hidden" role="status"></span>
          <ul id="snippet-list" class="snippet-list" aria-label="Notes"></ul>
          <div class="sidebar-tools" role="group" aria-label="Note library actions">
            <button id="library-tools-btn" class="library-tools-trigger" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Import & backup</span></button>
            <button id="trash-btn" class="trash-trigger" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Trash</span><span id="trash-count">0</span></button>
          </div>
        </aside>

        <main id="main">
          <div id="note-titlebar">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Hide note history" title="Hide note history" aria-controls="sidebar" aria-expanded="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M9 4v16" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </button>
            <span id="note-title">Untitled</span>
            <div class="titlebar-right">
              <div class="toolbar-group toolbar-layout" role="group" aria-label="Writing layout">
              <button id="focus-mode-btn" class="export-btn" type="button" aria-label="Focus mode" aria-pressed="false" title="Focus mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button id="writing-width-btn" class="export-btn" type="button" aria-label="Full width" aria-pressed="false" title="Full width">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 8 4 12l4 4m8-8 4 4-4 4M4 12h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              </div>
              <div id="view-toggle" class="view-toggle" role="group" aria-label="View mode">
                <button type="button" class="view-opt active" data-view-value="edit"><span>Edit</span></button>
                <button type="button" class="view-opt" data-view-value="preview"><span>Preview</span></button>
              </div>
              <button id="mobile-view-toggle" class="mobile-view-toggle" type="button" aria-label="Switch to Preview" aria-pressed="false">
                <span class="mobile-view-toggle-track" aria-hidden="true"><span class="mobile-view-toggle-thumb"></span></span>
                <span class="mobile-view-toggle-label">Edit</span>
              </button>
              <div class="toolbar-group toolbar-actions" role="group" aria-label="Note actions">
              <button id="copy-markdown-btn" class="export-btn" type="button" aria-label="Copy Markdown" title="Copy Markdown">
                <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.7"/></svg>
                <svg class="copy-check" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button id="export-btn" class="export-btn" type="button" aria-label="Export Raw" title="Export Raw">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span id="export-label">Export Raw</span>
              </button>
              </div>

            </div>
          </div>
          <div id="save-error" class="save-error" role="alert" hidden><span id="save-error-message"></span><button id="retry-save" type="button">Retry save</button></div>
          <div class="preview-tools" role="toolbar" aria-label="Preview formatting" hidden>
            <div class="preview-format-group"><button type="button" data-command="bold" aria-label="Bold" title="Bold"><b>B</b></button><button type="button" data-command="italic" aria-label="Italic" title="Italic"><span class="preview-mark-italic">I</span></button><button type="button" data-command="strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button></div>
            <div class="preview-format-group"><button type="button" data-command="link" aria-label="Link" title="Link"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 9.6a2.6 2.6 0 0 0 3.7.2l1.5-1.5a2.6 2.6 0 0 0-3.7-3.7L6.8 5.7M9.6 6.4a2.6 2.6 0 0 0-3.7-.2L4.4 7.7a2.6 2.6 0 0 0 3.7 3.7l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button><input id="preview-link-url" type="url" inputmode="url" aria-label="Link URL" placeholder="https://" hidden></div>
            <div class="preview-format-group"><button type="button" data-command="bullet" aria-label="Bullet list" title="Bullet list">•</button><button type="button" data-command="ordered" aria-label="Numbered list" title="Numbered list">1.</button><button type="button" data-command="quote" aria-label="Quote" title="Quote">“</button></div>
            <div class="preview-format-group"><button type="button" data-command="code" aria-label="Inline code" title="Inline code">&lt;/&gt;</button></div>
          </div>
          <div id="source-editor"></div>
          <article id="markdown-preview" class="markdown-preview" tabindex="-1" aria-label="Note preview" hidden></article>
        </main>
      </div>

      <button id="focus-exit" class="focus-exit" type="button" title="Exit focus mode (Esc)" hidden>Exit focus <kbd>Esc</kbd></button>
      <span id="copy-status" class="visually-hidden" role="status"></span>
      <div id="undo-toast" class="undo-toast" hidden><span id="undo-message"></span><button id="undo-btn" type="button">Undo</button></div>
      <div id="recovery-status" class="visually-hidden" role="status"></div>

      <!-- Full-document plain-text mirror. Kept in the DOM so page-content readers
           see the whole note even though the source editor only paints visible
           lines. Always holds raw Markdown, never rendered HTML. -->
      <pre id="full-text-mirror" class="visually-hidden"></pre>

      <a
        id="privacy-fab"
        class="privacy-fab"
        href="privacy.html"
        title="Privacy Policy"
        aria-label="Privacy Policy"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 3l7 3v6c0 4.5-2.8 7.8-7 9-4.2-1.2-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <script type="module" src="editor.ts"></script>
  </body>
</html>
